apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimized-app-deployment
  namespace: optimized-app-prod
  labels:
    app: optimized-app
spec:
  replicas: 3  # Alta disponibilidad (mínimo 2-3)
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: optimized-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: optimized-app
    spec:
      containers:
        - name: optimized-app
          image: myacrregistry.azurecr.io/optimized-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: optimized-app-config
            - secretRef:
                name: optimized-app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: acr-pull-secret
